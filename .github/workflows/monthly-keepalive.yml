name: Monthly repository keepalive

on:
  schedule:
    - cron: "23 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-repository-writer
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update heartbeat
        shell: bash
        run: |
          mkdir -p activity
          date -u +"%Y-%m-%dT%H:%M:%SZ" > activity/last-heartbeat.txt

      - name: Commit heartbeat
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity/last-heartbeat.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Monthly keepalive $(date -u +%Y-%m)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

