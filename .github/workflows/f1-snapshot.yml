name: F1 data extraction

on:
  schedule:
    # Friday-Sunday at 09:17, 15:17 and 21:17 Beijing time.
    - cron: "17 1,7,13 * * 5,6,0"
    # Monday final catch-up at 13:17 Beijing time.
    - cron: "17 5 * * 1"
    # Next-season calendar refresh on the first day of each month at 13:17.
    - cron: "17 5 1 * *"
  workflow_dispatch:
    inputs:
      collect_next:
        description: "Also refresh the next-season calendar"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: f1-repository-writer
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine seasons
        id: seasons
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_COLLECT_NEXT: ${{ inputs.collect_next }}
        run: |
          current="$(TZ=Asia/Shanghai date +%Y)"
          next="$((current + 1))"
          collect_next=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_COLLECT_NEXT" == "true" ]]; then
            collect_next=true
          fi
          if [[ "$EVENT_SCHEDULE" == "17 5 1 * *" ]]; then
            collect_next=true
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "collect_next=${collect_next}" >> "$GITHUB_OUTPUT"
          echo "Current season: ${current}; next season: ${next}; collect_next=${collect_next}"

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Collect current season
        shell: bash
        run: |
          python tools/f1_collector.py \
            --year "${{ steps.seasons.outputs.current }}" \
            --output artifacts/current \
            --cache-dir .cache/current \
            --refresh \
            --delay 0.35

      - name: Collect next season when published
        id: next
        if: steps.seasons.outputs.collect_next == 'true'
        shell: bash
        run: |
          set +e
          python tools/f1_collector.py \
            --year "${{ steps.seasons.outputs.next }}" \
            --output artifacts/next \
            --cache-dir .cache/next \
            --refresh \
            --delay 0.35
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Next-season collection was skipped (exit ${code})."
          fi

      - name: Publish stable current snapshot
        run: |
          python tools/f1_snapshot.py \
            artifacts/current/season.json \
            "data/f1-${{ steps.seasons.outputs.current }}.json" \
            --expected-year "${{ steps.seasons.outputs.current }}"

      - name: Publish stable next snapshot
        if: steps.next.outputs.available == 'true'
        run: |
          python tools/f1_snapshot.py \
            artifacts/next/season.json \
            "data/f1-${{ steps.seasons.outputs.next }}.json" \
            --expected-year "${{ steps.seasons.outputs.next }}"

      - name: Build compact current pack
        shell: bash
        run: |
          mkdir -p dist
          python tools/build_f1_pack.py \
            "data/f1-${{ steps.seasons.outputs.current }}.json" \
            "dist/f1-${{ steps.seasons.outputs.current }}.f1p" \
            --expected-year "${{ steps.seasons.outputs.current }}"

      - name: Build compact next pack
        if: steps.next.outputs.available == 'true'
        shell: bash
        run: |
          python tools/build_f1_pack.py \
            "data/f1-${{ steps.seasons.outputs.next }}.json" \
            "dist/f1-${{ steps.seasons.outputs.next }}.f1p" \
            --expected-year "${{ steps.seasons.outputs.next }}"

      - name: Build device manifest
        shell: bash
        run: |
          python tools/build_manifest.py \
            --current "dist/f1-${{ steps.seasons.outputs.current }}.f1p" \
            --next "dist/f1-${{ steps.seasons.outputs.next }}.f1p" \
            --output dist/f1-manifest.json

      - name: Upload complete extraction
        uses: actions/upload-artifact@v4
        with:
          name: f1-extraction-${{ github.run_id }}
          path: |
            artifacts/
            dist/
          if-no-files-found: error
          retention-days: 30

      - name: Commit changed snapshots and packs
        shell: bash
        run: |
          git add data dist
          if git diff --cached --quiet -- data dist; then
            echo "No meaningful F1 data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update F1 snapshots and packs for $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

