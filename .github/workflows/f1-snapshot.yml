name: F1 session watcher

on:
  schedule:
    # The workflow checks hourly, but only contacts Formula 1 after a session
    # enters its result window.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_current:
        description: "Force current-season collection outside a session window"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: f1-repository-writer
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine current season
        id: seasons
        shell: bash
        run: |
          current="$(TZ=Asia/Shanghai date +%Y)"
          next="$((current + 1))"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Current season: ${current}; next season: ${next}"

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Check current session window
        id: gate
        shell: bash
        env:
          FORCE_CURRENT: ${{ inputs.force_current }}
        run: |
          snapshot="data/f1-${{ steps.seasons.outputs.current }}.json"
          if [[ ! -f "$snapshot" ]]; then
            echo "should_collect=true" >> "$GITHUB_OUTPUT"
            echo "reason=bootstrap-snapshot" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(
            "$snapshot"
            --now-epoch "$(date -u +%s)"
            --delay-minutes 15
            --grace-hours 6
          )
          if [[ "${FORCE_CURRENT}" == "true" ]]; then
            args+=(--force)
          fi
          python tools/collection_window.py "${args[@]}"

      - name: Collect current season and complete results
        if: steps.gate.outputs.should_collect == 'true'
        shell: bash
        run: |
          python tools/f1_collector.py \
            --year "${{ steps.seasons.outputs.current }}" \
            --output artifacts/current \
            --cache-dir .cache/current \
            --existing "data/f1-${{ steps.seasons.outputs.current }}.json" \
            --refresh \
            --delay 0.2

      - name: Publish stable current snapshot
        if: steps.gate.outputs.should_collect == 'true'
        run: |
          python tools/f1_snapshot.py \
            artifacts/current/season.json \
            "data/f1-${{ steps.seasons.outputs.current }}.json" \
            --expected-year "${{ steps.seasons.outputs.current }}"

      - name: Build compact current pack
        if: steps.gate.outputs.should_collect == 'true'
        shell: bash
        run: |
          mkdir -p dist
          python tools/build_f1_pack.py \
            "data/f1-${{ steps.seasons.outputs.current }}.json" \
            "dist/f1-${{ steps.seasons.outputs.current }}.f1p" \
            --expected-year "${{ steps.seasons.outputs.current }}"

      - name: Build device manifest
        if: steps.gate.outputs.should_collect == 'true'
        shell: bash
        run: |
          current="dist/f1-${{ steps.seasons.outputs.current }}.f1p"
          next="dist/f1-${{ steps.seasons.outputs.next }}.f1p"
          args=(--current "$current" --output dist/f1-manifest.json)
          if [[ -f "$next" ]]; then
            args+=(--next "$next")
          fi
          python tools/build_manifest.py "${args[@]}"

      - name: Upload complete extraction
        if: steps.gate.outputs.should_collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: f1-extraction-${{ github.run_id }}
          path: |
            artifacts/
            dist/
          if-no-files-found: error
          retention-days: 30

      - name: Commit changed snapshots and packs
        if: steps.gate.outputs.should_collect == 'true'
        shell: bash
        run: |
          git add data dist
          if git diff --cached --quiet -- data dist; then
            echo "No meaningful F1 data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update F1 data after session $(date -u +%FT%TZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
